repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.2.2
    hooks:
      - id: sqlfluff-fix
        stages: [pre-commit]
        files: ^db/.*\.sql$
        args: [--dialect, postgres]
      - id: sqlfluff-lint
        stages: [pre-commit]
        files: ^db/.*\.sql$
        args: [--dialect, postgres]
